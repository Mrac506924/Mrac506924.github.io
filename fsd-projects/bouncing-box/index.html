
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Box</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1e293b;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #38bdf8;
        }

        #gameBoard {
            width: 90%;
            max-width: 800px;
            height: 350px;
            background: white;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            border: 5px solid #38bdf8;
            border-radius: 12px;
        }

        #box {
            width: 60px;
            height: 60px;
            background: #f97316;
            position: absolute;
            top: 145px;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #score {
            font-size: 24px;
            color: #4ade80;
        }

        button {
            padding: 12px 25px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: #0284c7;
            color: white;
        }

        #instructions {
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1> Bouncing Box</h1>

    <p>Click the box to earn points and increase its speed!</p>

    <div id="score">Score: 0</div>

    <div id="gameBoard">
        <div id="box">0</div>
    </div>

    <p id="instructions">
        Click the orange box to make it faster!
    </p>

    <button onclick="restartGame()">Restart Game</button>

    <script>
        // Get game elements
        const box = document.getElementById("box");
        const board = document.getElementById("gameBoard");
        const scoreDisplay = document.getElementById("score");

        // Variable declarations
        let positionX = 0;
        let points = 0;
        let speed = 10;

        // Move the box
        function update() {

            positionX += speed;

            const boardWidth = board.clientWidth;
            const boxWidth = box.offsetWidth;

            // Bounce off the right wall
            if (positionX >= boardWidth - boxWidth) {
                positionX = boardWidth - boxWidth;
                speed *= -1;
            }

            // Bounce off the left wall
            if (positionX <= 0) {
                positionX = 0;
                speed *= -1;
            }

            box.style.left = positionX + "px";
        }

        // Handle box clicks
        function handleBoxClick() {

            points++;

            // Reset box position
            positionX = 0;

            // speed
            speed = 3 * points + 10;

            // Update box text
            box.textContent = points;

            // Update score display
            scoreDisplay.textContent = "Score: " + points;
        }

        // Restart game
        function restartGame() {
            positionX = 0;
            points = 0;
            speed = 10;

            box.textContent = "0";
            scoreDisplay.textContent = "Score: 0";
            box.style.left = "0px";
        }

        box.addEventListener("click", handleBoxClick);

        setInterval(update, 20);

    </script>

</body>
</html>
